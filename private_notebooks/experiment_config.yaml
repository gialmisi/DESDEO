## problems for which summary statistics make sense

summary_problems:
  [
    "branin",
    "mystery",
    "cantilevered_beam",
    "pressure_vessel",
    "townsend",
    "g2",
    "g6",
    "g8",
    "g9",
    "g24",
  ]

# plotting settings
plotting:
  fig_width: 11.0
  row_height: 3.2
  ci_alpha: 0.18
  gen_ticks: 7
  grid_alpha: 0.25
  grid_lw: 0.6

  suptitle_y: 1.05
  xlabel_y: -0.02

  rcparams:
    font.size: 10
    axes.titlesize: 10
    axes.labelsize: 10
    legend.fontsize: 9
    xtick.labelsize: 9
    ytick.labelsize: 9
    pdf.fonttype: 42
    ps.fonttype: 42
    figure.titlesize: 10

  palette:
    black: "#000000"
    blue: "#0072B2"
    orange: "#E69F00"
    red: "#D55E00"

  mode_style:
    baseline:
      { color: "#000000", linestyle: "-", linewidth: 2.0, label: "Baseline" }
    relaxed:
      { color: "#0072B2", linestyle: "--", linewidth: 2.0, label: "Relaxed" }
    ranking:
      { color: "#E69F00", linestyle: ":", linewidth: 2.2, label: "Ranking" }

  optimum_line:
    color: "#D55E00"
    linestyle: "-"
    linewidth: 1.6
    label: "Optimum"

  # Per (problem, metric) y-scale overrides: "log", "symlog", etc.
  yscale_overrides:
    g9:best_so_far: "log"
    g9:shadow_price_diff: "log"

  # Per (problem, metric) inset zoom: show a small zoomed-in subplot
  inset_overrides:
    g9:best_so_far:
      ylim: [678, 800]
      xlim_evals_start: 500
      position: [0.45, 0.45, 0.50, 0.50]
    g9:shadow_price_diff:
      ylim: [40, 200]
      xlim_evals_start: 500
      position: [0.45, 0.45, 0.50, 0.50]

  legend:
    y: 1.03
    frameon: true
    facecolor: "white"
    edgecolor: "black"
    framealpha: 1.0
    linewidth: 0.8
    fancybox: false
