# General setup

results_dir: "results"
data_gen_script: "scripts/experiment_1.py"
front_gen_script: "scripts/generate_front.py"
summary_stats_script: "scripts/summary_statistics.py"
thresholds_script: "scripts/compute_thresholds.py"
plot_script: "scripts/plot_summary_figures.py"
mode_table_script: "scripts/mode_comparison_table.py"
result_extension: "parquet"
base_seed: 28012026

# NSGA3 options for front generation

xover_probability: 0.9
xover_distribution: 20
tournament_size: 2
distribution_index: 20

# Experiment-specific operator settings (overrides for experiment_1.py only)
experiment_xover_distribution: 3
experiment_distribution_index: 1
experiment_mutation_probability_factor: 1  # multiplier for 1/n_vars

# Niching for the 'ranking' mode in experiment_1.py: "crowding", "knearest", or "kth"
ranking_niching: "kth"
ranking_niching_k: 3

# Data generation

modes: ["baseline", "relaxed", "ranking"]
population_sizes: [12, 36, 60]
n_generations: 200
n_runs: 500

# Random samples for inactive constraint thresholds

n_random_samples: 10000

# Epsilon for approximating shadow front nadir point

hv_eps_percent: 0.01

# Front generation

n_generations_front: 10000
population_size_front: 200
seed_perturb_fraction: 0.2
seed_sigma: 0.02
seed_flip_prob: 0.1

# Constraint thresholds (low/med/high) are now hand-picked per problem under
# 'manual_thresholds' below. They used to be derived from positive constraint
# violations on optimum-improving solutions in the NSGA-3-generated reference
# front (rule: thresholds_from_positive_violations_on_optimum_improvers), but
# for several problems that computation produced values far outside the actual
# image of the constraints in the reachable design space, which made the
# constraint-relaxation experiments meaningless. The picked values were chosen
# from the interactive contour plots produced by scripts/plot_threshold_picker.py;
# rationale notes live in results/figures/threshold_picker/hand_picked.md.
# scripts/compute_thresholds.py now reads these values straight from the config
# (it still uses the reference front, but only to compute objective_shadow_optima
# at each ct level, which downstream plotting/stats need).
#
# threshold_improvement_percentages is kept for historical reference but is
# no longer used.
threshold_improvement_percentages: [0.05, 0.10, 0.20] # low, med, high (deprecated)

# Remember to update 'PROBLEM_BUILDERS' in utils.py when adding new problems!

problems:
  - name: "branin"
    constraint_symbols: ["c_1"]
    objective_symbol: "f_1"
    objective_optimum: -268.78792
    optimal_solution: [3.2730, 0.0489]
    manual_thresholds:
      low:  { c_1: 15.0 }
      med:  { c_1: 40.0 }
      high: { c_1: 60.0 }

  - name: "mystery"
    constraint_symbols: ["c_1"]
    objective_symbol: "f_1"
    objective_optimum: -1.174261
    optimal_solution: [2.5044, 2.5778]
    manual_thresholds:
      low:  { c_1: 0.15 }
      med:  { c_1: 0.25 }
      high: { c_1: 0.35 }

